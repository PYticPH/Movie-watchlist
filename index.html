<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Movie watchlist</title>
</head>

<body>
  <header>
    <div class="top-header">
      <h1>Find your movie</h1>
      <div class="watchlist">
        <p>My Watchlist</p>
        <span class="watchlist-counter" id="watchlist-counter">0</span>
      </div>
    </div>
    <div class="search-container">
      <input type="search" id="user-input" placeholder="Search for a movie">
      <button type="submit" id="search" class="search-btn">Search</button>
      <img src="images/search.png" alt="search">
    </div>
  </header>
  <main id="main">
    <img src="images/film.png" alt="film" class="film">
    <p class="start-exploring">Start exploring</p>
  </main>
  <footer>
  </footer>
  <script src="script.js"></script>
</body>

</html>
